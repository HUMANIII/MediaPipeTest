<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sakura Hair · Unity 실행 결과</title>
<style>body{margin:0;background:#10151d;color:#e7e9ed;font:16px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:32px}h1{font-size:28px;margin:0}p{color:#adb7c8}video{display:block;max-height:65vh;max-width:100%;margin:auto;border-radius:12px;background:#0d1118}.controls{display:flex;gap:12px;justify-content:center;align-items:center;margin:16px 0}button,select{background:#283342;border:1px solid #485568;color:white;border-radius:6px;padding:10px 16px;font:inherit}figure{margin:0}figcaption{text-align:center;color:#c7d0df;padding:8px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}img{width:100%;border-radius:10px}h2{font-size:20px;margin-top:32px}output{font-variant-numeric:tabular-nums}a{color:#f0a8c6}</style>
<main><h1>Sakura Hair · Interior Fall</h1><p>머리카락 안의 별도 공간에서 떨어지는 벚꽃 · 앞 3초 고정 / 뒤 3초 카메라 회전 · Unity Play Mode 실제 캡처 · 6초 / 30fps</p>
<video id="demo" controls playsinline preload="metadata" poster="front-on.png" src="SakuraHairInteriorFall.mp4"></video>
<div class="controls"><button id="play" type="button">재생</button><button id="restart" type="button">처음부터</button><label>속도 <select id="speed" aria-label="재생 속도"><option value="1">1배속</option><option value="0.5">0.5배속</option></select></label><output id="time">0.00 / 6.00초</output></div>
<h2>같은 조명에서 효과 켜기 / 끄기</h2><div class="compare"><figure><img src="front-off.png" alt="효과 강도 0인 원래 머릿결"><figcaption>효과 끄기</figcaption></figure><figure><img src="front-on.png" alt="벚꽃 내부 낙하 효과가 적용된 머리카락"><figcaption>효과 켜기</figcaption></figure></div>
<h2>다른 각도</h2><div class="compare"><figure><img src="side-on.png" alt="옆머리의 벚꽃 효과"><figcaption>측면</figcaption></figure><figure><img src="back-on.png" alt="뒷머리의 벚꽃 효과"><figcaption>후면</figcaption></figure></div>
<p>새 씬: Assets/06.Scenes/SakuraHairDemo.unity<br>조절: Assets/SakuraHairDemo/Materials/SakuraHair.mat</p></main>
<script>const v=document.getElementById('demo'),p=document.getElementById('play'),t=document.getElementById('time');p.onclick=()=>v.paused?v.play():v.pause();document.getElementById('restart').onclick=()=>{v.currentTime=0;v.play()};document.getElementById('speed').onchange=e=>v.playbackRate=Number(e.target.value);v.onplay=()=>p.textContent='일시 정지';v.onpause=()=>p.textContent='재생';v.ontimeupdate=()=>t.textContent=`${v.currentTime.toFixed(2)} / ${(v.duration||6).toFixed(2)}초`;</script></html>
